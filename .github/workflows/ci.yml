name: Continuous integration

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clientFrontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4500
      API_URL: http://127.0.0.1:4500
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      REVALIDATE_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clientFrontend/package-lock.json
      - run: npm ci
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adminFrontend
    env:
      REACT_APP_API_URL: http://127.0.0.1:4500
      CI: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: adminFrontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
